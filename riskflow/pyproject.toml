[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "riskflow"
version = "0.1.0"
description = "Credit risk scorecard, rule-mining and decision-policy toolkit"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
]

[project.optional-dependencies]
# Only needed to TRAIN. Scoring runs on numpy + pandas alone.
train = [
    "scikit-learn>=1.3",
    "scipy>=1.10",
    "xgboost>=2.0",
]
report = ["matplotlib>=3.7"]
dev = ["pytest>=7.4"]

[project.scripts]
riskflow = "riskflow.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: end-to-end tests that fit a model",
]
filterwarnings = ["ignore::FutureWarning"]
